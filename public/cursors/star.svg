<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="40" height="40">
  <defs>
    <!-- 星辉金：与月轮同源 -->
    <linearGradient id="star" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE082"/>
      <stop offset="0.5" stop-color="#FFC93C"/>
      <stop offset="1" stop-color="#F9A825"/>
    </linearGradient>
  </defs>

  <!-- 白色衬边：与日间竹叶同样的处理，保证任何背景下都能看清。
       没有它，金星压在夜晚的朱红按钮上会糊成一片（金色与朱红色相只差约 30°，
       深褐描边在红底上只是一圈脏边）。stroke-width 需明显大于下面的 2.4，
       才能在描边外侧留出一圈可见白边。 -->
  <path d="M 6.8 8.8 L 26.0 17.6 L 41.6 3.3 L 39.2 24.3 L 57.6 34.7 L 36.9 38.9 L 32.7 59.6 L 22.3 41.2 L 1.3 43.6 L 15.6 28.0 Z"
        fill="#fff" stroke="#fff" stroke-width="7"
        stroke-linejoin="round" stroke-linecap="round"/>

  <!-- 星形主体（最上方的尖角即热点所在） -->
  <path d="M 6.8 8.8 L 26.0 17.6 L 41.6 3.3 L 39.2 24.3 L 57.6 34.7 L 36.9 38.9 L 32.7 59.6 L 22.3 41.2 L 1.3 43.6 L 15.6 28.0 Z"
        fill="url(#star)" stroke="#B26A00" stroke-width="2.4"
        stroke-linejoin="round" stroke-linecap="round"/>

  <!-- 高光 -->
  <path d="M 14 14 L 24 18.5 L 35 10"
        fill="none" stroke="#FFF8E1" stroke-width="2.2"
        stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  <circle cx="44" cy="33" r="2.2" fill="#FFF8E1" opacity="0.9"/>
</svg>
